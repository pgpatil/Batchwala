<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7B718">
<meta name="description" content="Orders, bakes, deliveries, payments and stock for a home bakery.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batchwala">
<title>Batchwala</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap"><main id="main"><div class="loading">Loading…</div></main></div>
<button class="fab" id="fab" style="display:none"></button>
<nav class="nav" id="nav" aria-label="Main" style="display:none"></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="confirm" id="confirm" role="alertdialog" aria-modal="true"><div class="cbox" id="cbox"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="update" id="update" role="status"><span>A new version is ready.</span><button id="reload">Update</button></div>
<script type="module" src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      nw && nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) {
          document.getElementById("update").classList.add("show");
          document.getElementById("reload").onclick = () => nw.postMessage("skip");
        }
      });
    });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
